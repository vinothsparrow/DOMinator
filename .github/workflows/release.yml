name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Same checks on demand, without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run lint

      - run: npm run test:run

      - name: Build and package Chrome
        run: npm run package

      - name: Build and package Firefox
        run: npm run package:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: dominator-zips
          path: releases/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
          generate_release_notes: true
          body: |
            Store-ready archives are attached: upload `dominator-chrome-*.zip` to the
            Chrome Web Store and `dominator-firefox-*.zip` to addons.mozilla.org.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
            for what is in this version.
